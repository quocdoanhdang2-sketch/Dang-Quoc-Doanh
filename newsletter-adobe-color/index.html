<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bài thực hành Newsletter — Adobe Color</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#f6f8fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .wrap{max-width:960px;margin:auto}
    .choice{border:0;border-radius:24px;overflow:hidden;box-shadow:0 14px 36px #172b4d18}
    .preview{height:180px}
    .v1{background:linear-gradient(135deg,#0055CC,#0C66E4,#579DFF)}
    .v2{background:linear-gradient(135deg,#4C1D95,#7C3AED,#F59E0B)}
    .btn{min-height:48px;font-weight:800}
  </style>
</head>
<body>
<main class="container wrap py-5">
  <div class="text-center mb-5">
    <span class="badge text-bg-dark mb-3">BÀI THỰC HÀNH UI/UX</span>
    <h1 class="display-5 fw-bold">Phối màu Newsletter</h1>
    <p class="lead text-secondary">Hai phiên bản cùng cấu trúc, sử dụng hai bộ màu khác nhau.</p>
  </div>
  <div class="row g-4">
    <div class="col-md-6">
      <article class="card choice h-100">
        <div class="preview v1"></div>
        <div class="card-body p-4">
          <h2 class="h3 fw-bold">Ocean Focus</h2>
          <p class="text-secondary">Palette xanh tương đồng: rõ ràng, tin cậy, gần với tinh thần Trello.</p>
          <a href="newsletter_version1.html" class="btn btn-primary w-100">Mở phiên bản 1</a>
        </div>
      </article>
    </div>
    <div class="col-md-6">
      <article class="card choice h-100">
        <div class="preview v2"></div>
        <div class="card-body p-4">
          <h2 class="h3 fw-bold">Sunset Studio</h2>
          <p class="text-secondary">Palette tím–vàng: sáng tạo, tương phản mạnh và giàu năng lượng.</p>
          <a href="newsletter_version2.html" class="btn w-100" style="background:#7C3AED;color:white">Mở phiên bản 2</a>
        </div>
      </article>
    </div>
  </div>
</main>
</body>
</html>
